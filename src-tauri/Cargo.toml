[package]
name = "kitty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A desktop UI for the coding agents you already have."

[lib]
name = "kitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
kitty-catalog = { workspace = true }
kitty-core = { workspace = true }
kitty-engine = { workspace = true }
kitty-probe = { workspace = true }
kitty-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
