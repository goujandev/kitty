[workspace]
resolver = "2"
members = ["crates/core", "crates/probe", "crates/supervisor", "crates/harness", "crates/engine", "crates/store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/goujan/kitty"

[workspace.dependencies]
kitty-core = { path = "crates/core" }
kitty-probe = { path = "crates/probe" }
kitty-supervisor = { path = "crates/supervisor" }
kitty-harness = { path = "crates/harness" }
kitty-engine = { path = "crates/engine" }
kitty-store = { path = "crates/store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Noise from pedantic that we do not want to fight.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
