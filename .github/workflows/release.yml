name: Release readiness

# Publishing is a local, explicitly requested action using the existing key.
# A tag never launches another installer build or publishes automatically.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional successful CI run for the current main source'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect checked installer without rebuilding or publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          args=(--inspect)
          if [ -n "$REQUESTED_RUN_ID" ]; then args+=(--run-id "$REQUESTED_RUN_ID"); fi
          npm run release:fast -- "${args[@]}"
