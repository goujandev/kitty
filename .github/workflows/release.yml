name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, e.g. v0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Verify version and release configuration
        run: node scripts/check-release.mjs $env:RELEASE_TAG
      - name: Require signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing.' }
      - run: npm run check
      - run: npm run test:updates
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build and upload signed installer and update feed
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Kitty v__VERSION__'
          releaseBody: |
            Download the Windows x64 -setup.exe for a first installation.
            Existing updater-enabled installations can use Settings > Updates.
            Versions without an updater need one manual installation of v0.1.1 or newer.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --ci --bundles nsis -- --locked
      - name: Verify uploaded update feed before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern latest.json --dir target/release-feed --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release feed' }
          node scripts/check-release.mjs $env:RELEASE_TAG target/release-feed/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release manifest' }
          $installer = Get-ChildItem target/release/bundle/nsis -Filter ("*_" + $env:RELEASE_TAG.Substring(1) + "_x64-setup.exe") | Select-Object -First 1
          cargo run -p kitty --example verify_update --locked -- $installer.FullName
