name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # Windows only, on purpose. pantheon targets Windows and nothing else
    # (ADR-0001), so there is no matrix to keep green.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache pinned speech archives
        uses: actions/cache@v4
        with:
          path: target/dictation-pack-downloads
          key: speech-windows-${{ hashFiles('src-tauri/src/dictation.rs') }}
          restore-keys: speech-windows-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Frontend first: it is seconds, and catching a type error before a
      # ten-minute Rust build is worth the ordering.
      - name: TypeScript and wire contract
        run: npm run check

      - name: Update flow and release configuration
        run: npm run test:updates && npm run test:release-tools

      - name: Branding and upgrade compatibility
        run: npm run test:branding

      - name: Dictation interactions
        run: npm run test:dictation

      - name: Working state and workspace interactions
        run: npm run test:activity && npm run test:workspace

      - name: Prepare verified bundled dictation resources
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-dictation-pack.ps1

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The wire contract is generated by a test. If a type changed and the
      # committed contract did not, the test above fails. If someone
      # regenerated it and forgot to commit, this catches that instead.
      - name: No uncommitted generated files
        run: git diff --exit-code

      - name: Frontend build
        # TypeScript/contract already passed above; avoid their duplicate run.
        run: npm exec -- vite build

      # Build once while CI is already warm. Publication downloads these exact
      # checked bytes; it does not start a second native build or verifier job.
      - name: Build release-ready Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' | Set-Content target/release-ci.json
          npm run bundle -- --ci --config (Resolve-Path target/release-ci.json).Path -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Determine installed upgrade smoke scope
        id: smoke-scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $required = $true
          if ($env:BEFORE_SHA -match '^[0-9a-f]{40}$' -and $env:BEFORE_SHA -notmatch '^0+$') {
            git cat-file -e "$($env:BEFORE_SHA)^{commit}"
            if ($LASTEXITCODE -eq 0) {
              $changed = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
              if ($LASTEXITCODE -ne 0) { throw 'Cannot determine smoke scope' }
              # Include all config edits conservatively, even a version bump.
              $relevant = '^(src-tauri/(tauri\.conf\.json|windows/|icons/|icon-source\.|build\.rs|src/|Cargo\.toml)|crates/store/|src/stores/|scripts/(installed-rebrand-smoke|prepare-dictation-pack)\.ps1|\.github/workflows/ci\.yml|Cargo\.(toml|lock)|package(-lock)?\.json|docs/licenses/)'
              if (@($changed | Where-Object { $_ -match $relevant }).Count -eq 0) {
                # Only inherit coverage from a successful CI source that still
                # has a release-ready artifact. A failed/missing baseline runs
                # the smoke again, even when this push only changes UI text.
                $runsJson = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f "head_sha=$env:BEFORE_SHA" -f event=push -f status=success -f per_page=1
                if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect smoke baseline CI' }
                $runs = ($runsJson | ConvertFrom-Json).workflow_runs
                if ($runs.Count -gt 0) {
                  $artifactsJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($runs[0].id)/artifacts"
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect smoke baseline artifact' }
                  $ready = @(($artifactsJson | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq "pantheon-windows-$env:BEFORE_SHA" -and !$_.expired })
                  $required = $ready.Count -eq 0
                }
              }
            }
          }
          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Installed rebrand upgrade smoke on disposable runner
        if: steps.smoke-scope.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.2.4 --repo $env:GITHUB_REPOSITORY --pattern '*_x64-setup.exe' --pattern '*.exe.sig' --dir target/prior-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download previous signed release' }
          $previous = Get-ChildItem target/prior-release -Filter '*_x64-setup.exe' | Select-Object -First 1
          cargo run -p pantheon --example verify_update --locked -- $previous.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer signature is invalid' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem target/release/bundle/nsis -Filter ("*_" + $version + "_x64-setup.exe") | Select-Object -First 1
          if (!$installer) { throw 'Current installer is missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/installed-rebrand-smoke.ps1 -PreviousInstaller $previous.FullName -NewInstaller $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgrade smoke failed' }

      - name: No generated source drift after packaging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git diff --exit-code

      - name: Prepare exact-source release receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PANTHEON_INSTALLED_SMOKE: ${{ steps.smoke-scope.outputs.required == 'true' && 'passed' || 'unchanged' }}
          PANTHEON_SMOKE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/prepare-release-artifact.mjs

      - name: Upload release-ready installer and receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pantheon-windows-${{ github.sha }}
          path: target/release-ready/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
